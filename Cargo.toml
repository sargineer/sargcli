[package]
name = "sargcli"
version = "0.1.0"
repository = "https://github.com/sargineer/sargcli"
edition = "2021"
description = "sarg — ask sarg, tell sarg: the command line for sargineer.com"
license = "MIT"

[[bin]]
name = "sarg"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
directories = "6"
libc = "0.2"
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = { version = "0.8", features = ["preserve_order"] }
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
httpmock = "0.7"
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
